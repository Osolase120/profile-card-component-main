<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400..700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="index.css">
  
  <title>Frontend Mentor | Profile card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main>

    <img src="./images/bg-pattern-top.svg" alt="" class="bg-pattern-top">

    <img src="./images/bg-pattern-card.svg" alt="" class="bg-pattern-card">

    <div class="blank">

    </div>

    <img src="./images/image-victor.jpg" alt="" class="image-victor">

    <p class="Victor">Victor Crest <span>26</span></p>

    <p class="London">London</p>

    <hr>

    <div class="eighty">
      <h2>80K</h2>

      <span>Followers</span>
    </div>

    <div class="three">
      <h2>803K</h2>

      <span>Likes</span>
    </div>

    <div class="four">
      <h2>1.4K</h2>

      <span>Photos</span>
    </div>

    <img src="./images/bg-pattern-bottom.svg" alt="" class="bg-pattern-bottom">

  </main>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="">Osolase</a>.
  </div>
</body>
</html>
